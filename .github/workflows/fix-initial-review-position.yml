name: Fix initial review position

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-initial-review-position.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set first review position before scripts load
        run: |
          perl -0pi -e 's/id="heroReviews" aria-label=/id="heroReviews" data-slide="1" aria-label=/' index.html
          grep -F 'id="heroReviews" data-slide="1" aria-label=' index.html
      - name: Commit the fix
        run: |
          rm .github/workflows/fix-initial-review-position.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-initial-review-position.yml
          git commit -m "Fix initial hero review position"
          git push
