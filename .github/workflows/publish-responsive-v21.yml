name: Publish responsive site update

on:
  push:
    paths:
      - ".github/workflows/publish-responsive-v21.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the responsive update
        run: |
          base64 -d .github/index-v21.patch.zst.b64 > /tmp/index-v21.patch.zst
          zstd -d --patch-from=index.html /tmp/index-v21.patch.zst -o /tmp/index.updated.html
          test "$(sha256sum /tmp/index.updated.html | cut -d' ' -f1)" = "07ef08dfe5c902830bbdfc85a8663593eb94c8cb89f7210d3f78859b58ec5870"
          mv /tmp/index.updated.html index.html
          base64 -d .github/concerts-v21.patch.zst.b64 > /tmp/concerts-v21.patch.zst
          zstd -d --patch-from=concerts.html /tmp/concerts-v21.patch.zst -o /tmp/concerts.updated.html
          test "$(sha256sum /tmp/concerts.updated.html | cut -d' ' -f1)" = "23fedad2a919e44f6e58df63e527767b691f9341f3ac55eb5eb38c5db9a14b50"
          mv /tmp/concerts.updated.html concerts.html
          mkdir -p assets
          base64 -d .github/pavel-pisanko-trombone.jpg.b64 > assets/pavel-pisanko-trombone.jpg
          test "$(sha256sum assets/pavel-pisanko-trombone.jpg | cut -d' ' -f1)" = "d98f0702b5e9d4e26eb027cac9a8da4beaaa928686a37bbc235b2699d1e07f30"
          rm .github/index-v21.patch.zst.b64
          rm .github/concerts-v21.patch.zst.b64
          rm .github/pavel-pisanko-trombone.jpg.b64
          rm .github/workflows/publish-responsive-v21.yml
      - name: Commit the completed site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve responsive reviews and navigation"
          git push
