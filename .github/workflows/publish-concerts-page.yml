name: Publish concerts page links

on:
  push:
    paths:
      - ".github/workflows/publish-concerts-page.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the home page
        run: |
          base64 -d .github/index-concerts.patch.zst.b64 > /tmp/index-concerts.patch.zst
          zstd -d --patch-from=index.html /tmp/index-concerts.patch.zst -o /tmp/index.updated.html
          test "$(sha256sum /tmp/index.updated.html | cut -d' ' -f1)" = "f09308a3f1bf0d97516f52b3f7908e012259c60d9c82708f1da9dc40097b0831"
          mv /tmp/index.updated.html index.html
          rm .github/index-concerts.patch.zst.b64
          rm .github/workflows/publish-concerts-page.yml
      - name: Commit the completed site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Link concerts page from home"
          git push
