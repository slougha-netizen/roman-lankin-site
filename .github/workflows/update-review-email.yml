name: Update review email

on:
  push:
    paths:
      - .github/workflows/update-review-email.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update review email interaction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          old_button = """</div><div style="margin-top:28px"><a class="btn primary" href="mailto:slougha@gmail.com?subject=%D0%9E%D1%82%D0%B7%D1%8B%D0%B2%20%D0%B4%D0%BB%D1%8F%20%D1%81%D0%B0%D0%B9%D1%82%D0%B0%20%D0%A0%D0%BE%D0%BC%D0%B0%D0%BD%D0%B0%20%D0%9B%D0%B0%D0%BD%D0%BA%D0%B8%D0%BD%D0%B0">Ваш отзыв →</a></div></div>"""
          new_button = """</div><div style="margin-top:28px"><button class="btn primary" id="reviewEmailButton" type="button" aria-controls="reviewEmail" aria-expanded="false">Ваш отзыв →</button><span id="reviewEmail" hidden style="font-size:clamp(18px,2.2vw,24px);color:var(--gold);letter-spacing:.02em;user-select:text">roman.lankin@gmail.com</span></div></div>"""

          if html.count(old_button) != 1:
              raise SystemExit("Expected exactly one old review button")
          html = html.replace(old_button, new_button)

          marker = """

const heroSlides=[...document.querySelectorAll('.hero-slide')];"""
          behavior = """

const reviewEmailButton=document.getElementById('reviewEmailButton');
          const reviewEmail=document.getElementById('reviewEmail');
          if(reviewEmailButton&&reviewEmail){
            reviewEmailButton.addEventListener('click',()=>{
              reviewEmailButton.hidden=true;
              reviewEmail.hidden=false;
            });
          }"""
          if html.count(marker) != 1:
              raise SystemExit("Expected exactly one script insertion point")
          html = html.replace(marker, behavior + marker)

          path.write_text(html, encoding="utf-8")
          PY
      - name: Publish change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show review email without opening mail client"
          git push
