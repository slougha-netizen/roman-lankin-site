name: Update artist description

on:
  push:
    paths:
      - ".github/workflows/update-artist-description.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace description
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = "Роман Ланкин — гитарист-виртуоз, аранжировщик, исполнитель песен, соединяющий в своём творчестве джаз, бразильскую босса-нову, авторскую песню и музыку разных культур и эпох."
          new = "Роман Ланкин — гитарист-виртуоз, аранжировщик, исполнитель песен, соединяющий в своём творчестве музыку разных культур и эпох: американский джаз, бразильскую босса-нову, эстрадные песни прошлых лет и русскую авторскую песню."
          if text.count(old) != 1:
              raise SystemExit("Expected description was not found exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm .github/workflows/update-artist-description.yml
      - name: Publish text correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update artist description"
          git push
